<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>TOP Project: Admin Dashboard</title>
</head>
<body>
    <header>
        <div class="searchBarDiv">
            <img alt="magnifying-glass">
            <input type="text" placeholder="...">
        </div> 
        <div class="profileWidget">
            <img id="bellIcon" alt="Bell Icon">
            <div class="profilePic"><img class="adminPic" alt="User Profile Picture"></div>
            <p>JC</p>
        </div>
        <div class="userInfo">
            <div class="welcomeMessage">
                <div class="profilePic"><img class="adminPic" alt="User Profile Picture"></div>
                <div class="adminWelcome">
                    <p>Hi, there,</p>
                    <p>JC (@josrlost)</p>
                </div>
            </div>
            <div class="btnSection">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </header>
    <main>
        
    </main>
    <aside>
        <div class="sidebarTitle">
            <img alt="Dashboard icon">
            <p>Dashboard</p>
        </div>
        <div class="sidebarWidgets">
            <div class="mainSidebarWidgets">
                <div class="mainWidgetsDiv"><img alt="Home Icon"><p>Home</p></div>
                <div class="mainWidgetsDiv"><img alt="Profile Icon"><p>Profile</p></div>
                <div class="mainWidgetsDiv"><img alt="Message Icon"><p>Messages</p></div>
                <div class="mainWidgetsDiv"><img alt="Clock"><p>History</p></div>
                <div class="mainWidgetsDiv"><img alt="Tasks"><p>Tasks</p></div>
                <div class="mainWidgetsDiv"><img alt="People"><p>Communities</p></div>
            </div>
            <div class="lesserSidebarWidgets">
                <div class="lesserWidgetsDiv"><img alt="Nut"><p>Settings</p></div>
                <div class="lesserWidgetsDiv"><img alt="question mark">Support</div>
                <div class="lesserWidgetsDiv"><img alt="Check mark">Privacy</div>
            </div>
        </div>
    </aside>
</body>
</html>
